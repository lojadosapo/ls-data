name: Sheets Sync

on:
  schedule:
    - cron: "47 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      cards_days:
        description: "Dias para sincronizar cards Hablla, contando ate hoje"
        required: false
        default: "7"
        type: string
      cards_exhaustive:
        description: "Percorrer todas as paginas para a carga retroativa"
        required: false
        default: false
        type: boolean
      cards_only:
        description: "Executar somente a sincronizacao da Base Hablla Card"
        required: false
        default: false
        type: boolean

concurrency:
  group: omie-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sincronizar planilhas
        run: |
          if [ "${{ inputs.cards_only }}" = "true" ]; then
            node src/sheets/run.js hablla/sheets/sync.js
          else
            node src/sheets/run.js omie/sheets/sync.js hablla/sheets/sync.js
          fi
        env:
          REQUIRED_ENV: ${{ inputs.cards_only && 'GOOGLE_CLIENT_EMAIL,GOOGLE_PRIVATE_KEY,HABLLA_TOKEN,HABLLA_WORKSPACE_ID,HABLLA_BOARD_ID,HABLLA_SPREADSHEET_ID,HABLLA_COLLABORATORS_SPREADSHEET_ID' || 'GOOGLE_CLIENT_EMAIL,GOOGLE_PRIVATE_KEY,OMIE_CREDENTIALS,OMIE_SHEETS_SPREADSHEET_ID,HABLLA_TOKEN,HABLLA_WORKSPACE_ID,HABLLA_BOARD_ID,HABLLA_SPREADSHEET_ID,HABLLA_COLLABORATORS_SPREADSHEET_ID' }}
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          OMIE_CREDENTIALS: ${{ secrets.OMIE_CREDENTIALS }}
          OMIE_SHEETS_SPREADSHEET_ID: ${{ secrets.OMIE_SHEETS_SPREADSHEET_ID }}
          OMIE_SHEETS_DAYS: ${{ vars.OMIE_SHEETS_DAYS || '7' }}
          HABLLA_TOKEN: ${{ secrets.HABLLA_TOKEN }}
          HABLLA_EMAIL: ${{ secrets.HABLLA_EMAIL }}
          HABLLA_PASSWORD: ${{ secrets.HABLLA_PASSWORD }}
          HABLLA_WORKSPACE_ID: ${{ secrets.HABLLA_WORKSPACE_ID }}
          HABLLA_BOARD_ID: ${{ secrets.HABLLA_BOARD_ID }}
          HABLLA_CARDS_DAYS: ${{ inputs.cards_days || vars.HABLLA_CARDS_DAYS || '7' }}
          HABLLA_CARDS_EXHAUSTIVE: ${{ inputs.cards_exhaustive || 'false' }}
          HABLLA_SHEETS_DATASETS: ${{ inputs.cards_only && 'cards' || vars.HABLLA_SHEETS_DATASETS || 'cards,attendants' }}
          HABLLA_CARDS_MAX_PAGES: ${{ vars.HABLLA_CARDS_MAX_PAGES || '2000' }}
          HABLLA_CARDS_PAGES_WITHOUT_RECENT_CREATED: ${{ vars.HABLLA_CARDS_PAGES_WITHOUT_RECENT_CREATED || '2' }}
          HABLLA_SPREADSHEET_ID: ${{ secrets.HABLLA_SPREADSHEET_ID }}
          HABLLA_COLLABORATORS_SPREADSHEET_ID: ${{ secrets.HABLLA_COLLABORATORS_SPREADSHEET_ID }}
