name: Sheets Sync

on:
  schedule:
    - cron: "47 4,10,16,22 * * *"
  workflow_dispatch:

concurrency:
  group: omie-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Sincronizar planilhas
        run: node src/sheets/run.js omie/sheets/sync.js hablla/sheets/sync.js
        env:
          REQUIRED_ENV: GOOGLE_CLIENT_EMAIL,GOOGLE_PRIVATE_KEY,OMIE_CREDENTIALS,OMIE_SHEETS_SPREADSHEET_ID,HABLLA_TOKEN,HABLLA_WORKSPACE_ID,HABLLA_BOARD_ID,HABLLA_SPREADSHEET_ID,HABLLA_COLLABORATORS_SPREADSHEET_ID
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          OMIE_CREDENTIALS: ${{ secrets.OMIE_CREDENTIALS }}
          OMIE_SHEETS_SPREADSHEET_ID: ${{ secrets.OMIE_SHEETS_SPREADSHEET_ID }}
          OMIE_SHEETS_DAYS: ${{ vars.OMIE_SHEETS_DAYS || '7' }}
          HABLLA_TOKEN: ${{ secrets.HABLLA_TOKEN }}
          HABLLA_EMAIL: ${{ secrets.HABLLA_EMAIL }}
          HABLLA_PASSWORD: ${{ secrets.HABLLA_PASSWORD }}
          HABLLA_WORKSPACE_ID: ${{ secrets.HABLLA_WORKSPACE_ID }}
          HABLLA_BOARD_ID: ${{ secrets.HABLLA_BOARD_ID }}
          HABLLA_SPREADSHEET_ID: ${{ secrets.HABLLA_SPREADSHEET_ID }}
          HABLLA_COLLABORATORS_SPREADSHEET_ID: ${{ secrets.HABLLA_COLLABORATORS_SPREADSHEET_ID }}
