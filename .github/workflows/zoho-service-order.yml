name: Zoho Service Order

on:
  schedule:
    - cron: '2 15 * * *'
  workflow_dispatch:

concurrency:
  group: zoho-service-order
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Random delay to avoid rate limiting
        run: sleep $((RANDOM % 30 + 10))
      
      - name: Checkout with retry
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
        continue-on-error: true
        id: checkout1
      
      - name: Retry checkout if failed
        if: steps.checkout1.outcome == 'failure'
        run: |
          sleep $((RANDOM % 20 + 10))
        
      - name: Checkout retry attempt
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node src/zoho/zoho-service-order.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ACCOUNT_OWNER: ${{ secrets.ZOHO_ACCOUNT_OWNER }}
          ZOHO_APP_NAME: ${{ secrets.ZOHO_APP_NAME }}
          ZOHO_LEADS_APP_NAME: ${{ secrets.ZOHO_LEADS_APP_NAME }}
          ZOHO_SERVICE_ORDER_REPORT_NAME: ${{ secrets.ZOHO_SERVICE_ORDER_REPORT_NAME }}
