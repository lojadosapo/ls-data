name: Omie Vendas e NF-e

on:
  # schedule:
  #   - cron: '30 7 * * *'  # Diariamente às 7:30 UTC (4:30 BRT)
  workflow_dispatch:

concurrency:
  group: omie-vendas-nfe
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Random delay to avoid rate limiting
        run: sleep $((RANDOM % 30 + 10))
      
      - name: Checkout with retry
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
        continue-on-error: true
        id: checkout1
      
      - name: Retry checkout if failed
        if: steps.checkout1.outcome == 'failure'
        run: |
          sleep $((RANDOM % 20 + 10))
        
      - name: Checkout retry attempt
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node src/omie/omie-vendas-nfe.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OMIE_APP_KEY: ${{ secrets.OMIE_APP_KEY }}
          OMIE_APP_SECRET: ${{ secrets.OMIE_APP_SECRET }}
          OMIE_VENDAS_DAYS: 30
