name: Encrypted local recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Create encrypted recovery artifact
        env:
          RECOVERY_PUBLIC_KEY_B64: 
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: |
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          if(!process.env.GOOGLE_PRIVATE_KEY) throw new Error('Source secret is empty');
          const key=crypto.randomBytes(32),iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,iv);
          const data=Buffer.concat([cipher.update(JSON.stringify({GOOGLE_PRIVATE_KEY:process.env.GOOGLE_PRIVATE_KEY})),cipher.final()]);
          fs.writeFileSync('recovery.enc.json',JSON.stringify({key:crypto.publicEncrypt({key:Buffer.from(process.env.RECOVERY_PUBLIC_KEY_B64,'base64'),padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key).toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:data.toString('base64')}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-recovery
          path: recovery.enc.json
          retention-days: 1

